<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorConnect - Profile</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="navbar-brand">TutorConnect</div>
        <ul class="navbar-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="profile.html" class="active">Profile</a></li>
        </ul>
        <div class="user-info">
            <span id="username-display"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-avatar" id="avatar">U</div>
            <div class="profile-info">
                <h1 id="profile-username">Loading...</h1>
                <p id="profile-email">Loading...</p>
                <div class="profile-stat">
                    <div class="stat">
                        <span class="stat-number">0</span>
                        <span class="stat-label">Sessions</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">0</span>
                        <span class="stat-label">Reviews</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- About Section -->
        <div class="section">
            <h2>Account Information</h2>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Username</div>
                    <div class="info-value" id="info-username">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Email</div>
                    <div class="info-value" id="info-email">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Member Since</div>
                    <div class="info-value" id="info-joined">-</div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="section">
            <h2>Quick Actions</h2>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="alert('This feature is coming soon!')">Find Tutors</button>
                <button class="btn btn-primary" onclick="alert('This feature is coming soon!')">My Sessions</button>
                <button class="btn btn-primary" onclick="alert('This feature is coming soon!')">Edit Profile</button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Load user profile on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
        });

        function loadUserProfile() {
            const user = JSON.parse(localStorage.getItem('user'));

            if (!user) {
                // Redirect to login if not authenticated
                window.location.href = 'login.html';
                return;
            }

            // Update navbar
            document.getElementById('username-display').textContent = user.username;

            // Update profile header
            const firstLetter = user.username.charAt(0).toUpperCase();
            document.getElementById('avatar').textContent = firstLetter;
            document.getElementById('profile-username').textContent = user.username;
            document.getElementById('profile-email').textContent = user.email;

            // Update account information
            document.getElementById('info-username').textContent = user.username;
            document.getElementById('info-email').textContent = user.email;
            document.getElementById('info-joined').textContent = new Date().toLocaleDateString();
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('user');
                
                // Call backend logout endpoint
                fetch('http://localhost:3000/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                }).then(() => {
                    window.location.href = 'home.html';
                }).catch(error => {
                    console.error('Logout error:', error);
                    window.location.href = 'home.html';
                });
            }
        }
    </script>
</body>
</html>
